# Dependency update proposals. Each PR still has to pass the full CI suite —
# nothing here merges on its own, and the repo's auto-commit hooks must not
# touch Dependabot branches.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
