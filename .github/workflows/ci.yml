name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    # macos-14 mirrors the release gates (release.yml); backend tests exercise
    # PTY/zsh behavior that only holds on macOS.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked
          uv --project marketplace/registry sync --locked

      - name: Lint backend (event-loop guardrail)
        run: uv --project backend run ruff check backend

      - name: Lint marketplace registry
        run: uv --project marketplace/registry run ruff check marketplace/registry/registry marketplace/registry/tests

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Packaged Plans integration gate
        run: pnpm run test:packaged-plans

      - name: Verify production Plans bundle excludes fixture
        run: |
          pnpm run build:plans
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go

      - name: Backend tests
        run: uv --project backend run pytest backend/tests

      - name: Marketplace registry tests
        run: uv --project marketplace/registry run pytest marketplace/registry/tests

      - name: Plugin contract fixtures
        run: uv --project marketplace/registry run python docs/plugin-contracts/validate-fixtures.py
