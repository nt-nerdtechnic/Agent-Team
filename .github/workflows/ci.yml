name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    # Known-vulnerability scan of the locked dependency trees (SCA). Advisory
    # for now: the first run found a backlog (see .agent-team/plans/
    # navide-security-program_*.html, A1), and a red gate nobody can clear is
    # a gate people learn to ignore. Flip continue-on-error off once the
    # backlog is cleared.
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: npm audit (high and above)
        run: pnpm audit --audit-level=high
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: pip-audit (backend lock)
        run: |
          uv --project backend export --format requirements-txt --no-hashes --no-emit-project > /tmp/backend-requirements.txt
          uv --project backend run --with pip-audit pip-audit -r /tmp/backend-requirements.txt

  frontend:
    name: Frontend checks and build
    # Keep the desktop checks on the release platform.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Build application and bundled plugins
        # The mini-IDE bundle (Monaco in one rollup graph) peaks above the
        # runner's ~2GB default V8 heap and aborts with exit 134. Same cap the
        # release build already uses.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

  backend:
    name: Backend checks
    # Backend tests exercise macOS PTY/zsh behavior.
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Lint backend (event-loop guardrail)
        run: uv --project backend run --locked ruff check backend

      - name: Backend tests
        run: uv --project backend run --locked pytest backend/tests

  registry:
    name: Marketplace registry and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: marketplace/registry/uv.lock
          cache-suffix: registry

      - name: Install dependencies
        run: uv --project marketplace/registry sync --locked

      - name: Lint marketplace registry
        run: uv --project marketplace/registry run --locked ruff check marketplace/registry/registry marketplace/registry/tests

      - name: Marketplace registry tests
        run: uv --project marketplace/registry run --locked pytest marketplace/registry/tests

      - name: Plugin contract fixtures
        run: uv --project marketplace/registry run --locked python docs/plugin-contracts/validate-fixtures.py

  lint-and-test:
    # Preserve the existing required-check name for branch protection.
    name: Lint and test
    if: ${{ always() }}
    needs: [frontend, backend, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$REGISTRY_RESULT" = success
