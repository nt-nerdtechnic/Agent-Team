name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and build
    # Keep the desktop checks on the release platform.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:run

      - name: Build application and bundled plugins
        # The mini-IDE bundle (Monaco in one rollup graph) peaks above the
        # runner's ~2GB default V8 heap and aborts with exit 134. Same cap the
        # release build already uses.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build

  backend:
    name: Backend checks
    # Backend tests exercise macOS PTY/zsh behavior.
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend

      - name: Install dependencies
        run: uv --project backend sync --locked

      - name: Lint backend (event-loop guardrail)
        run: uv --project backend run --locked ruff check backend

      - name: Backend tests
        run: uv --project backend run --locked pytest backend/tests

  plans:
    name: Packaged Plans checks
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: plans

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv --project backend sync --locked

      - name: Packaged Plans integration gate
        run: pnpm run test:packaged-plans

      - name: Verify production Plans bundle excludes fixture
        run: |
          pnpm run build:plans
          test -f dist-plugins/plans/index.html
          test ! -e dist-plugins/plans/backend/navide-plans
          test ! -e dist-plugins/plans/backend/navide-plans-go

  registry:
    name: Marketplace registry and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: marketplace/registry/uv.lock
          cache-suffix: registry

      - name: Install dependencies
        run: uv --project marketplace/registry sync --locked

      - name: Lint marketplace registry
        run: uv --project marketplace/registry run --locked ruff check marketplace/registry/registry marketplace/registry/tests

      - name: Marketplace registry tests
        run: uv --project marketplace/registry run --locked pytest marketplace/registry/tests

      - name: Plugin contract fixtures
        run: uv --project marketplace/registry run --locked python docs/plugin-contracts/validate-fixtures.py

  lint-and-test:
    # Preserve the existing required-check name for branch protection.
    name: Lint and test
    if: ${{ always() }}
    needs: [frontend, backend, plans, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PLANS_RESULT: ${{ needs.plans.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$PLANS_RESULT" = success
          test "$REGISTRY_RESULT" = success
